<!DOCTYPE html>
<html>
<head>
    <title>Request A Fabric | ASEBE FABRICS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5efe6;
            color: #2b1b14;
        }

        .request-page {
            min-height: 100vh;
            padding: 50px 20px;
        }

        .request-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: #fffaf3;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(59, 36, 24, 0.12);
        }

        .request-header {
            background: #2b1b14;
            color: #fffaf3;
            text-align: center;
            padding: 45px 25px;
        }

        .request-header p {
            margin: 0 0 10px;
            color: #d62828;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .request-header h1 {
            margin: 0 0 12px;
            font-size: 38px;
        }

        .request-header span {
            color: #e8d8c8;
            font-size: 16px;
        }

        .request-form {
            padding: 35px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
            color: #2b1b14;
        }

        .form-group input[type="file"],
        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8c8b8;
            border-radius: 8px;
            background: #fffdf9;
            color: #2b1b14;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #b30000;
            box-shadow: 0 0 0 3px rgba(179, 0, 0, 0.08);
        }

        .submit-button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 15px;
            background: #b30000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .submit-button:hover {
            background: #8f0000;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            color: #b30000;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .request-page {
                padding: 25px 15px;
            }

            .request-header h1 {
                font-size: 30px;
            }

            .request-form {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="request-page">

    <div class="request-container">

        <div class="request-header">
            <p>ASEBE FABRICS</p>
            <h1>Request A Fabric</h1>
            <span>Can't find the fabric you want? Send us a picture and details.</span>
        </div>

        <form class="request-form" action="/fabric-request" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label for="image">Fabric Image</label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5"
                    placeholder="Describe the fabric you want"></textarea>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="text" id="quantity" name="quantity"
                    placeholder="Example: 6 yards">
            </div>

            <button class="submit-button" type="submit">
                Submit Fabric Request
            </button>

            <a class="back-link" href="/customer">
                ← Back to Dashboard
            </a>

        </form>

    </div>

</div>

</body>
</html>
